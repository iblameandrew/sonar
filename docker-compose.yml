services:
  qsa:
    build: .
    image: qualitative-self-attention:0.2.0
    ports:
      - "8001:8001"
    environment:
      GENAI_BACKEND: ${GENAI_BACKEND:-dashscope}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nex-agi/nex-n2-pro}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.6-flash-2026-04-02}
    volumes:
      - qsa-data:/app/backend/data
    restart: unless-stopped

volumes:
  qsa-data:
